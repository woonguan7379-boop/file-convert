<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<title>每日钱包</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="每日钱包">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f7a5c'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='sans-serif'%3E%C2%A5%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--ink:#1c1b19;--muted:#76726a;--line:#e6e2da;--soft:#efede8;
  --accent:#1f7a5c;--accent-ink:#ffffff;--need:#1f7a5c;--want:#b97c0c;--waste:#c4432e;--income:#1f7a5c;
  --need-bg:#e3f1ea;--want-bg:#f8eed8;--waste-bg:#f8e3df;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413;--card:#1f1e1c;--ink:#f1efe9;--muted:#a29e95;--line:#33312d;--soft:#2a2926;
    --accent:#4fbf93;--accent-ink:#0f241b;--need:#4fbf93;--want:#e3ad3f;--waste:#ef6f5a;--income:#4fbf93;
    --need-bg:#1d3329;--want-bg:#3a2f17;--waste-bg:#3d221d;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#141413;--card:#1f1e1c;--ink:#f1efe9;--muted:#a29e95;--line:#33312d;--soft:#2a2926;
  --accent:#4fbf93;--accent-ink:#0f241b;--need:#4fbf93;--want:#e3ad3f;--waste:#ef6f5a;--income:#4fbf93;
  --need-bg:#1d3329;--want-bg:#3a2f17;--waste-bg:#3d221d;--shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.45;
  padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 24px}
h1{font-size:22px;margin:8px 0 2px;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.hero{text-align:center;padding:22px 16px 18px}
.hero .label{font-size:14px;color:var(--muted)}
.hero .big{font-size:46px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.hero.over .big{color:var(--waste)}
.hero.low .big{color:var(--want)}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;margin:12px 0 8px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.over>i{background:var(--waste)}.bar.low>i{background:var(--want)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kv b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.tx:first-child{border-top:0}
.tx .ic{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex:none}
.tx .mid{flex:1;min-width:0}
.tx .t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.tx .t2{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tx .amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx .amt.in{color:var(--income)}
.tx .amt.muted{color:var(--muted);text-decoration:line-through}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;font-weight:600}
.p-need{background:var(--need-bg);color:var(--need)}.p-want{background:var(--want-bg);color:var(--want)}.p-waste{background:var(--waste-bg);color:var(--waste)}
.p-gray{background:var(--soft);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;min-height:44px}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--waste-bg);color:var(--waste)}
.btn.block{width:100%}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px;border-radius:10px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(88px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;box-shadow:0 6px 20px rgba(0,0,0,.18);cursor:pointer;z-index:5}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button .e{font-size:21px;line-height:1;filter:grayscale(1);opacity:.7}
nav.tabs button.on{color:var(--accent);font-weight:600}
nav.tabs button.on .e{filter:none;opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 12px;font-size:14px;cursor:pointer;min-height:36px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.need3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.need3 button{border:2px solid transparent;border-radius:14px;padding:12px 4px;font-weight:600;cursor:pointer;min-height:54px}
.need3 .n-need{background:var(--need-bg);color:var(--need)}.need3 .n-want{background:var(--want-bg);color:var(--want)}.need3 .n-waste{background:var(--waste-bg);color:var(--waste)}
.need3 button.on{border-color:currentColor}
.need3 small{display:block;font-weight:400;font-size:11px;opacity:.85}
label.f{display:block;margin:14px 0 6px;font-size:13px;color:var(--muted);font-weight:600}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px;outline:none}
input.in:focus,textarea.in:focus,select.in:focus{border-color:var(--accent)}
input.amount{font-size:34px;font-weight:700;text-align:center;padding:8px;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fade{from{opacity:0}}
.banner{border-radius:16px;padding:14px;text-align:center;margin-bottom:6px}
.banner.ok{background:var(--need-bg)}.banner.bad{background:var(--waste-bg)}.banner.info{background:var(--soft)}
.banner .b1{font-size:13px;color:var(--muted)}
.banner .b2{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.banner .b3{font-size:14px;margin-top:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90vw;text-align:center}
.hbar{display:grid;grid-template-columns:92px 1fr auto;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.hbar .track{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.hbar .v{font-variant-numeric:tabular-nums;font-size:13px;min-width:70px;text-align:right}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--soft);margin:10px 0}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c);vertical-align:-1px}
.daily{position:relative;display:flex;align-items:flex-end;gap:4px;height:130px;padding-top:8px;margin-top:6px}
.daily .d{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.daily .d i{display:block;width:100%;max-width:22px;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:2px}
.daily .d i.over{background:var(--waste)}
.daily .d span{font-size:10px;color:var(--muted)}
.daily .plan{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.6;pointer-events:none}
.ins{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.ins:first-of-type{border-top:0}
.ins .i{font-size:20px;flex:none}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--soft);border-radius:10px;padding:10px;word-break:break-all;user-select:all;margin:6px 0}
ol.steps{padding-left:20px;margin:6px 0}ol.steps li{margin:6px 0;font-size:14px}
details.card summary{cursor:pointer;font-weight:600;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"›";float:right;color:var(--muted);transition:transform .2s}
details.card[open] summary::after{transform:rotate(90deg)}
.fixed-row{display:grid;grid-template-columns:1fr 82px 74px 34px;gap:6px;margin:6px 0}
.fixed-row select.in{padding:11px 4px}
.x{border:0;background:var(--soft);border-radius:10px;cursor:pointer;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:18px 0;font-size:14px}
.daygrp{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:16px 4px 4px;font-weight:600}
.where{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;margin-top:8px}
.where b{font-weight:600}
.conv{font-size:12px;color:var(--muted);font-weight:400}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:16px}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.opt .f{font-size:24px}
.curchips .chip{padding:5px 10px;min-height:32px;font-size:13px}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<button class="fab" id="fab" aria-label="记一笔">+</button>
<nav class="tabs" id="tabs">
  <button data-tab="home"><span class="e">💰</span>今天</button>
  <button data-tab="list"><span class="e">🧾</span>账单</button>
  <button data-tab="stats"><span class="e">📊</span>分析</button>
  <button data-tab="settings"><span class="e">⚙️</span>设置</button>
</nav>
<div id="sheet"></div>
<script>
"use strict";
/* ========== 基础数据 ========== */
const KEY = "licai.v1";
const CURS = {
  MYR:{sym:"RM", n:"马币 MYR"},
  SGD:{sym:"S$", n:"新币 SGD"},
  CNY:{sym:"¥",  n:"人民币 CNY"},
  USD:{sym:"US$",n:"美元 USD"},
  HKD:{sym:"HK$",n:"港币 HKD"},
};
const REGIONS = {
  SG:{n:"新加坡",  f:"🇸🇬", cur:"SGD"},
  MY:{n:"马来西亚",f:"🇲🇾", cur:"MYR"},
  CN:{n:"中国",    f:"🇨🇳", cur:"CNY"},
};
const curRegion = cur => Object.keys(REGIONS).find(k=>REGIONS[k].cur===cur);
// 估计汇率（每 1 美元），联网后自动更新
const FX_DEFAULT = {USD:1, MYR:4.3, SGD:1.32, CNY:7.15, HKD:7.8};

const CATS = [
  {id:"food",   n:"餐饮",     e:"🍜", need:"need", kw:/美团|饿了么|餐|饭|面|粉|麦当劳|肯德基|kfc|mcd|mcdonald|汉堡|披萨|pizza|食堂|小吃|火锅|烧烤|grabfood|grab ?food|foodpanda|shopeefood|deliveroo|restaurant|cafe|kopitiam|koufu|food ?court|hawker|nasi|mamak|subway|burger|ya kun|toast box|breadtalk|old chang kee|jollibee|texas chicken|4fingers|din tai fung|haidilao|海底捞|sushi|ramen|bak kut teh|chicken rice/i},
  {id:"drink",  n:"饮品零食", e:"🧋", need:"want", kw:/奶茶|咖啡|星巴克|starbucks|瑞幸|luckin|喜茶|奈雪|蜜雪|茶百道|古茗|coco|一点点|霸王茶姬|tealive|chagee|zus|coffee|kopi|甜品|蛋糕|零食|bakery|koi|liho|gong ?cha|playmade|mr ?coconut|each a cup|boost juice|llao|dessert|ice cream/i},
  {id:"grocery",n:"超市日用", e:"🛒", need:"need", kw:/超市|便利店|7-?eleven|全家|罗森|familymart|lawson|盒马|永辉|沃尔玛|walmart|家乐福|山姆|costco|aeon|lotus|mydin|giant|speedmart|jaya grocer|village grocer|watsons|屈臣氏|guardian|fairprice|ntuc|cold storage|sheng siong|don ?don ?donki|donki|mr ?diy|kk ?mart|mynews|daiso|unity|econsave|hero market|prime supermarket/i},
  {id:"traffic",n:"交通",     e:"🚇", need:"need", kw:/滴滴|地铁|公交|高铁|12306|火车|加油|石油|石化|停车|高速|出租|grab(?! ?food)|gojek|tada|ryde|comfortdelgro|cdg|zig|simplygo|ez-?link|smrt|sbs transit|transitlink|ktm|ets|rapid ?kl|mrt|lrt|petronas|shell|caltex|petron|bhp|esso|spc|sinopec|toll|plus ?mal|smart ?tag|parking|uber|taxi|bus|causeway|ciq|vep|airasia|scoot|jetstar|singapore airlines|malaysia airlines|firefly|batik/i},
  {id:"shop",   n:"购物",     e:"🛍️", need:"want", kw:/淘宝|天猫|京东|拼多多|抖音|唯品会|得物|闲鱼|小红书|shopee(?! ?food)|lazada|taobao|amazon|zalora|uniqlo|优衣库|zara|h&m|ikea|宜家|courts|harvey norman|challenger|apple store|popular|kinokuniya|decathlon|sephora|muji|cotton on|charles|padini|tiktok shop|qoo10|shein|temu/i},
  {id:"fun",    n:"娱乐",     e:"🎮", need:"want", kw:/电影|影城|影院|游戏|steam|ktv|门票|景区|演出|cinema|gsc|tgv|golden village|shaw|cathay|mbo|playstation|nintendo|xbox|genting|sentosa|universal studios|zoo|klook|karaoke|teo heng|bowling|timezone/i},
  {id:"sub",    n:"订阅会员", e:"📺", need:"want", kw:/会员|订阅|netflix|spotify|youtube|apple\.com|icloud|爱奇艺|腾讯视频|优酷|bilibili|disney|chatgpt|openai|claude|anthropic|viu|iqiyi|astro go|subscription|membership|gym|anytime fitness|fitness ?first|celebrity fitness/i},
  {id:"bill",   n:"生活缴费", e:"💡", need:"need", kw:/电费|水费|燃气|煤气|话费|宽带|国家电网|tnb|tenaga|unifi|maxis|celcom|digi|umobile|yes 4g|indah water|air selangor|syabas|ranhill|astro|time fibre|singtel|starhub|\bm1\b|circles ?life|simba|giga|sp group|sp services|city energy|geneco|senoko|town council|conservancy|iras|lhdn|jpj|insurance|takaful|保险|prudential|great eastern|aia|income/i},
  {id:"house",  n:"住房",     e:"🏠", need:"need", kw:/房租|租金|物业|房贷|rent|hdb|condo|management fee|maintenance fee|airbnb|agoda|booking\.com|hotel|酒店/i},
  {id:"health", n:"医疗",     e:"💊", need:"need", kw:/医院|诊所|药|医疗|体检|牙|clinic|hospital|pharmacy|farmasi|klinik|dental|polyclinic|caring|alpro|big pharmacy/i},
  {id:"study",  n:"学习",     e:"📚", need:"need", kw:/书|课|培训|教育|学费|考试|udemy|coursera|tuition|school|university|course/i},
  {id:"social", n:"人情社交", e:"🎁", need:"want", kw:/红包|礼物|礼品|请客|聚餐|鲜花|花店|angpao|ang pow|gift|florist/i},
  {id:"wallet", n:"钱包充值", e:"👛", need:"want", kw:null},
  {id:"other",  n:"其他",     e:"📦", need:"want", kw:null},
];
const INCOME_CATS = [{id:"salary",n:"工资",e:"💼"},{id:"side",n:"副业",e:"🧰"},{id:"refund",n:"退款",e:"↩️"},{id:"gift",n:"红包转账",e:"🧧"},{id:"inc_other",n:"其他收入",e:"💵"}];
const NEED = {need:{n:"必要",d:"不花会影响生活"},want:{n:"想要",d:"开心，但可以少"},waste:{n:"不必要",d:"花了会后悔"}};
const SRC = {sms:"短信/邮件",pay:"Apple Pay",ocr:"截图识别",cash:"快捷记",manual:"手动",paste:"粘贴"};
const catOf = id => CATS.find(c=>c.id===id) || INCOME_CATS.find(c=>c.id===id) || CATS[CATS.length-1];

function blank(){
  return {
    settings:{home:"MYR",income:0,savings:0,payday:1,fixed:[],setupDone:false,regionMode:"auto",geo:false,topupAsSpend:true},
    tx:[], seen:{}, fx:{rates:{...FX_DEFAULT}, ts:0, live:false}, geoFix:null,
  };
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.tx)) {
      const b = blank();
      const old = s.settings||{};
      s.settings = Object.assign(b.settings, old);
      if (!CURS[s.settings.home]) s.settings.home = {"¥":"CNY","RM":"MYR","S$":"SGD","$":"USD"}[old.currency] || "MYR";
      delete s.settings.currency;
      s.seen = s.seen || {};
      if (!s.seenV2){ s.seen = {}; s.seenV2 = true; }
      s.fx = s.fx && s.fx.rates ? s.fx : b.fx;
      s.tx.forEach(t=>{ if(!t.cur){ t.cur=s.settings.home; t.rate=1; t.amountHome=t.amount; } });
      return s;
    }
  }catch(e){}
  return blank();
}
let S = load();
let storageOK = true;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch(e){ storageOK = false; toast("⚠️ 保存失败：浏览器不允许存储（是否开了无痕浏览？）"); }
}
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

/* ========== 工具 ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = n => Math.round(n*100)/100;
const HOME = () => S.settings.home;
function money(n, cur, sign){
  cur = cur || HOME();
  const v = Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  const s = n<0 ? "-" : (sign && n>0 ? "+" : "");
  return s + (CURS[cur]?CURS[cur].sym:cur) + v;
}
const day0 = d => { const x=new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const daysBetween = (a,b) => Math.round((day0(b)-day0(a))/864e5);
const dim = (y,m) => new Date(y,m+1,0).getDate();
const pad = n => String(n).padStart(2,"0");
const hm = ts => { const d=new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const md = d => (d.getMonth()+1)+"月"+d.getDate()+"日";
const WK = "日一二三四五六";
function hash(str){ let h=5381; for(let i=0;i<str.length;i++) h=((h<<5)+h+str.charCodeAt(i))|0; return (h>>>0).toString(36); }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const conv = (n, from, to) => from===to ? n : n*rateTo(from, to);

// 新加坡本岛+附近岛屿的大致轮廓（纬度, 经度），用来和新山区分
const SG_POLY = [[1.330,103.615],[1.360,103.635],[1.390,103.665],[1.425,103.695],[1.445,103.735],[1.448,103.770],[1.460,103.805],[1.465,103.825],[1.440,103.870],[1.430,103.910],[1.425,103.960],[1.425,104.040],[1.380,104.090],[1.300,104.090],[1.250,103.880],[1.150,103.750],[1.180,103.600],[1.290,103.590]];
function inPoly(lat, lon, poly){
  let inside=false;
  for (let i=0,j=poly.length-1;i<poly.length;j=i++){
    const [yi,xi]=poly[i],[yj,xj]=poly[j];
    if (((yi>lat)!==(yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function ccFromLatLon(lat, lon){
  if (inPoly(lat, lon, SG_POLY)) return "SG";
  if (lat>0.85 && lat<7.5 && ((lon>99.6&&lon<104.6)||(lon>109.5&&lon<119.3))) return "MY";
  if (lat>18 && lat<54 && lon>73 && lon<135) return "CN";
  return null;
}
function refreshGeo(force){
  if (!S.settings.geo || !navigator.geolocation) return;
  if (!force && S.geoFix && Date.now()-S.geoFix.ts < 20*60e3) return;
  navigator.geolocation.getCurrentPosition(p=>{
    const cc = ccFromLatLon(p.coords.latitude, p.coords.longitude);
    if (cc){ const changed = !S.geoFix || S.geoFix.cc!==cc; S.geoFix={cc, ts:Date.now()}; save(); if (changed||force) render(); if (force) toast(`📍 定位：${REGIONS[cc].f} ${REGIONS[cc].n}`); }
    else if (force) toast("定位成功，但不在新马中三地范围内");
  }, err=>{ if (force) toast(err.code===1 ? "没有定位权限：设置 → Safari → 位置 → 允许" : "定位失败，稍后再试"); },
  {maximumAge:15*60e3, timeout:10000, enableHighAccuracy:false});
}
function regionNow(){

  if (st.regionMode!=="auto" && REGIONS[st.regionMode]) return {cc:st.regionMode, how:"手动"};
  const now = Date.now();
  if (st.geo && S.geoFix && now-S.geoFix.ts < 3*3600e3) return {cc:S.geoFix.cc, how:"定位"};

  if (recent) return {cc:curRegion(recent.cur), how:"最近交易"};

  return {cc: curRegion(HOME()) || "MY", how:"默认"};
}

/* ========== 交易识别（短信 / 邮件 / 截图文字） ========== */
const CURTOK = "人民币|RMB|CNY|￥|¥|RM|MYR|SGD|S\\$|USD|US\\$|HKD|HK\\$|\\$";
function curFromTok(tok){
  if (!tok) return null;
  const t = tok.toUpperCase();
  if (/人民币|RMB|CNY|￥|¥|元|块/.test(t)) return "CNY";
  if (/^RM$|MYR/.test(t)) return "MYR";
  if (/SGD|S\$/.test(t)) return "SGD";
  if (/USD|US\$/.test(t)) return "USD";
  if (/HKD|HK\$/.test(t)) return "HKD";
  return "$";
}
const HINT_SG = /PayNow|PayLah|DBS|POSB|OCBC|UOB|Singtel|StarHub|SimplyGo|EZ-?Link|\bNETS\b|FairPrice|Sheng Siong|Singapore|Trust Bank|GXS|MariBank/i;
const HINT_MY = /\bTNG\b|Touch ?'?n ?Go|DuitNow|Maybank|CIMB|Public ?Bank|RHB|Hong ?Leong|AmBank|Bank Islam|\bBSN\b|Boost|MyDebit|Malaysia|Kuala Lumpur|Johor|GXBank|AEON Bank/i;
const HINT_CN = /银行|ZFB|WXP|财付通|微信|人民币|云闪付/;
const TOPUP_WORDS = /\breload|top ?-?up|topup|充值|转入钱包|add money/i;
const TOPUP_MERCH = /TNG ?DIGITAL|TNGD|TOUCH ?'?N ?GO|YOUTRIP|BIGPAY|WISE ?TOP/i;

function parseTx(raw, src){
  const rawStr = String(raw||"");
  const text = rawStr.replace(/\s+/g," ").trim();
  if (!text) return {ok:false, reason:"内容是空的"};
  const t = text.replace(/支付宝/g,"ZFB").replace(/微信支付/g,"WXP");
  if (/验证码|校验码|动态码|动态密码|\bOTP\b|\bTAC\b|verification code|one-time password/i.test(t) && !/余额|balance|successful/i.test(t))
    return {ok:false, reason:"这是验证码短信，不是交易"};

  let kind = null;
  const kws = [
    ["transfer", /信用卡还款|还款成功|自动还款|repayment|card payment received|bill payment to .*card/i],
    ["topup",    TOPUP_WORDS],
    ["refund",   /退款|退货|退回|冲正|撤销|refund|reversal|reversed/i],
    ["income",   /收入|入账|存入|转入|汇入|到账|收款|代发|工资|credited|received|receive|deposit|salary|incoming|from\s+[A-Z]/i],
    ["expense",  /支出|消费|支付|扣款|扣费|付款|转出|取现|取款|刷卡|WXP|ZFB|spent|charged|debited|purchase|payment|paid|pay\b|withdraw|txn|transaction|deducted|transfer(?:red)? (?:of|to)|sent|successful/i],
  ];
  let firstPos = Infinity;
  for (const [k,re] of kws){
    const m = t.match(re);
    if (!m) continue;
    if (k==="transfer" || k==="refund"){ kind = k; break; }
    if (k==="topup"){ if (src!=="ocr" || !/paid to|pay to|merchant(?: name)?\s*[:：]|recipient|收款方|商户|商家/i.test(t)) { kind = "topup"; break; } continue; }
    if (m.index < firstPos){ firstPos = m.index; kind = k; }
  }

  // 金额
  const re = new RegExp("(?<![A-Za-z])(?:("+CURTOK+")\\s?)?(\\d{1,3}(?:,\\d{3})+(?:\\.\\d{1,2})?|\\d+(?:\\.\\d{1,2})?)\\s?(元|块|RMB|CNY|MYR|SGD|USD|HKD)?(?![\\d%])","gi");
  let best = null, m;
  while ((m = re.exec(t))){
    const numStr = m[2], idx = m.index;
    const before = t.slice(Math.max(0, idx-10), idx);
    const after = t.slice(idx + m[0].length, idx + m[0].length + 1);
    const tok = m[1] || m[3];
    const hasCur = !!tok, hasDec = numStr.includes(".");
    if (/余额|可用|额度|结余|余|balance|bal\b|bal:|avail|limit|尾号|卡号|末四位|ending|card\s*\*?$|acct|a\/c|xx+$|\*+$|ref|no\.?\s*$/i.test(before)) continue;
    if (!hasCur && /[:：月日时分秒年号\/\-]/.test(after)) continue;
    if (!hasCur && /[:：\/\-]$/.test(before)) continue;
    if (!hasCur && !hasDec) continue;
    const v = parseFloat(numStr.replace(/,/g,""));
    if (!(v>0) || v>10000000) continue;
    let score = (hasCur?3:0) + (hasDec?1:0);
    if (firstPos!==Infinity && idx>firstPos && idx-firstPos<24) score += 2;
    if (!best || score>best.score) best = {v, score, cur:curFromTok(tok)};
  }
  if (!best) return {ok:false, reason:"没有找到交易金额"};
  if (!kind) kind = "expense";

  // 币种
  let cur = best.cur, curSrc = "text";
  if (cur==="$") cur = /US\$|USD/i.test(t) ? "USD" : "SGD";
  if (!cur){
    curSrc = "hint";
    cur = HINT_SG.test(t) ? "SGD" : HINT_MY.test(t) ? "MYR" : HINT_CN.test(t) ? "CNY" : null;
    if (!cur){ cur = localCur(); curSrc = "region"; }
  }

  // 商家
  let merchant = "";
  const brackets = [...text.matchAll(/【([^】]{1,30})】/g)].map(x=>x[1]).filter(x=>!/银行|bank|信用卡|支付宝|微信|财付通|云闪付/i.test(x));
  if (brackets.length) merchant = brackets[0];
  const lines = rawStr.split(/\r?\n+/).map(s=>s.trim()).filter(Boolean);
  if (!merchant && lines.length>1){
    for (let i=0;i<lines.length && !merchant;i++){
      const lm = lines[i].match(/^(?:paid to|pay to|to\b|merchant(?: name)?|recipient(?: name)?|transfer(?:red)? to|payee|收款方|收款人|商户(?:名称)?|商家|对方)\s*[:：]?\s*(.*)$/i);
      if (lm){ const v = (lm[1]||lines[i+1]||"").trim(); if (v && !/^[-+]?(?:RM|S\$|SGD|MYR|\$)?\s?[\d,.]+$/.test(v)) merchant = v.slice(0,40); }
    }
  }
  const pats = [
    /(?:财付通|ZFB|WXP|银联|云闪付|美团支付|京东支付)[-－—_]([^，,。;；\s]{1,30}?)(?=消费|支付|付款|[，,。;；\s]|$)/,
    /(?:商户|对方户名|对方账户|对方|收款方|交易对象)[:：]?\s*([^，,。;；\s]{1,30})/,
    /在([^，,。\s]{1,30}?)(?:消费|支付|快捷支付|网上支付|网络支付|POS|刷卡|付款|购物|交易)/,
    /向([^，,。]{1,30}?)(?:付款|支付|转账)/,
    /\bat\s+([A-Za-z0-9][A-Za-z0-9 &'.*\-]{1,40}?)(?=\s+(?:on|using|with|via|for|at|ref)\b|[.,;]|$)/i,
    /\b(?:merchant|to)[:\s]+([A-Za-z0-9][A-Za-z0-9 &'.*\-]{1,40}?)(?=\s+(?:on|at|via|using|ref|from)\b|[.,;]|$)/i,
    /\b(?:debited|charged|paid|payment)\s+for\s+([A-Za-z0-9][A-Za-z0-9 &'.*\-]{1,40}?)(?=\s+(?:on|at|via|using|ref)\b|[.,;]|$)/i,
    /\bfrom\s+([A-Za-z0-9][A-Za-z0-9 &'.*\-]{1,40}?)(?=\s+(?:on|at|via|using|ref|to)\b|[.,;]|$)/i,
  ];
  for (const p of pats){ if (merchant) break; const mm = t.match(p); if (mm) merchant = mm[1].trim(); }
  merchant = merchant.replace(/ZFB/g,"支付宝").replace(/WXP/g,"微信支付").replace(/[（(]?财付通[)）]?/g,"").trim();
  if (/^(?:your|you|the|a|card|account)\b/i.test(merchant)) merchant = "";
  if (!merchant){
    if (/PayNow/i.test(t)) merchant = "PayNow 转账";
    else if (/DuitNow/i.test(t)) merchant = "DuitNow";
    else if (HINT_MY.test(t) && /\bTNG\b|Touch ?'?n ?Go/i.test(t)) merchant = "TNG eWallet";
    else if (/PayLah/i.test(t)) merchant = "PayLah!";
    else if (/财付通|WXP|微信/.test(t)) merchant = "微信支付";
    else if (/ZFB/.test(t)) merchant = "支付宝";
  }
  if (kind==="expense" && src!=="ocr" && TOPUP_MERCH.test(merchant+" "+t) && !/toll|tol\b/i.test(t)) kind = "topup";
  if (kind==="topup" && /\bTNG\b|Touch ?'?n ?Go/i.test(t)) merchant = "TNG eWallet";
  return {ok:true, kind, amount:r2(best.v), cur, curSrc, merchant};
}
function guessCat(str){
  const s = String(str||"");
  for (const c of CATS) if (c.kw && c.kw.test(s)) return c;
  return CATS[CATS.length-1];
}

/* ========== 预算计算（全部换算成收入货币） ========== */
function cycle(now){
  const pd = Math.min(28, Math.max(1, +S.settings.payday||1));
  const mk = (y,m) => { const d=new Date(y,m,1); return new Date(d.getFullYear(), d.getMonth(), Math.min(pd, dim(d.getFullYear(), d.getMonth()))); };
  let start = mk(now.getFullYear(), now.getMonth());
  if (day0(now) < start) start = mk(now.getFullYear(), now.getMonth()-1);
  const end = mk(start.getFullYear(), start.getMonth()+1);
  return {start, end};
}
const fixedHome = f => conv(+f.amount||0, f.cur||HOME(), HOME());
const fixedTotal = () => S.settings.fixed.reduce((a,f)=>a+fixedHome(f),0);
const eff = tx => tx.kind==="expense" && !tx.fixed ? amtH(tx) : tx.kind==="refund" ? -amtH(tx) : 0;
function calc(now=new Date()){
  const st = S.settings;
  const pool = (+st.income||0) - fixedTotal() - (+st.savings||0);
  const {start,end} = cycle(now);
  const today = day0(now), tomorrow = addDays(today,1);
  const totalDays = daysBetween(start,end), daysLeft = Math.max(1, daysBetween(today,end));
  let spentBefore=0, spentToday=0;
  for (const tx of S.tx){
    if (tx.ts>=+start && tx.ts<+today) spentBefore += eff(tx);
    else if (tx.ts>=+today && tx.ts<+tomorrow) spentToday += eff(tx);
  }
  const remain = pool - spentBefore;
  const allowance = Math.max(0, remain)/daysLeft;
  const left = allowance - spentToday;
  const tomorrowAllow = daysLeft>1 ? Math.max(0, remain-spentToday)/(daysLeft-1) : null;
  return {pool, start, end, totalDays, daysLeft, dayNo:totalDays-daysLeft+1, spentBefore, spentToday, allowance, left, tomorrowAllow,
    cycleSpent: spentBefore+spentToday, cycleLeft: remain-spentToday, planDaily: pool/totalDays};
}
// 用当地货币显示，后面附上收入货币
function dual(nHome, opts={}){
  const lc = localCur(), h = HOME();
  if (lc===h) return money(nHome);
  const main = money(conv(nHome, h, lc), lc);
  return opts.mainOnly ? main : `${main} <span class="conv">≈ ${money(nHome)}</span>`;
}

/* ========== 处理快捷指令传来的链接 ========== */
function readHash(){
  const h = location.hash.slice(1);
  if (!h) return;
  history.replaceState(null, "", location.pathname + location.search);  // 防止刷新重复记账
  const dec = s => { try{ return decodeURIComponent(s.replace(/\+/g,"%20")); }catch(e){ return s; } };
  if (h.startsWith("sms=")) return capture({src:"sms", raw: dec(h.slice(4))});
  if (h.startsWith("ocr=")) return capture({src:"ocr", raw: dec(h.slice(4))});
  const p = {};
  for (const part of h.split("&")){ const i=part.indexOf("="); if(i>0) p[part.slice(0,i)] = dec(part.slice(i+1)); }
  if (p.sms) return capture({src:"sms", raw:p.sms});
  if (p.ocr) return capture({src:"ocr", raw:p.ocr});
  if (p.fixed) return importFixed(p.fixed);
  if (p.add!=null) return capture({src: p.src==="pay"?"pay":"cash", amountStr:p.add, merchant:p.m||"", note:p.note||"", cur:p.cur||""});
  if (p.tab && ["home","list","stats","settings"].includes(p.tab)) { tab = p.tab; render(); }
}
function importFixed(json){
  let d; try{ d = JSON.parse(json); }catch(e){ toast("导入链接格式不对"); return; }
  const items = (Array.isArray(d)?d:d.items||[]).filter(f=>f && f.name && +f.amount>0 && (!f.cur||CURS[f.cur])).map(f=>({name:String(f.name).slice(0,40), amount:r2(+f.amount), cur:f.cur||HOME()}));
  if (!items.length) { toast("导入链接里没有固定支出"); return; }
  const home = d.home && CURS[d.home] ? d.home : null;
  const msg = "要导入以下每月固定支出吗？\n\n" + items.map(f=>`· ${f.name}  ${money(f.amount,f.cur)}`).join("\n")
    + (home && home!==S.settings.home ? `\n\n并把收入货币设为 ${CURS[home].n}` : "")
    + (S.settings.fixed.length ? "\n\n（会替换现在已填的固定支出）" : "");
  setTimeout(()=>{
    if (!confirm(msg)) return;
    if (home && home!==S.settings.home){ S.settings.home = home; S.tx.forEach(setHomeAmount); }
    S.settings.fixed = items; save(); tab = "settings"; render(); scrollTo(0,0);
    toast("✅ 已导入 "+items.length+" 项固定支出，再填收入和存款就好");
  }, 300);
}
function capture(inp){
  const now = Date.now();
  for (const k in S.seen) if (now - S.seen[k] > 3*864e5) delete S.seen[k];
  let tx, r, seenKey = null;
  if (inp.src==="sms" || inp.src==="ocr"){
    const key = "s"+hash(inp.raw);
    if (S.seen[key]) { render(); return openInfo({info:"这笔已经记过了，不会重复扣钱。"}); }
    seenKey = key;
    r = parseTx(inp.raw, inp.src);
    if (!r.ok) { save(); render(); return openInfo({bad:r.reason, raw:inp.raw}); }
    const isIn = r.kind==="income"||r.kind==="refund";
    const c = isIn ? null : guessCat(r.merchant+" "+inp.raw);
    tx = {id:uid(), ts:now, amount:r.amount, cur:r.cur, curSrc:r.curSrc, kind:isIn?r.kind:"expense",
      merchant:r.merchant||(isIn?"转入":"消费"),
      cat: isIn ? (r.kind==="refund"?"refund":/工资|代发|salary/i.test(inp.raw)?"salary":"inc_other") : c.id,
      need: c ? c.need : null, fixed:false, note:"", src:inp.src, raw: inp.raw.slice(0,400)};
  } else {
    const s = String(inp.amountStr||"");
    const mm = s.replace(/,/g,"").match(/\d+(?:\.\d+)?/);
    const amt = mm ? parseFloat(mm[0]) : NaN;
    if (!(amt>0)) { render(); return openInfo({bad:"没有收到金额（快捷指令里的「金额」变量是不是空的？）"}); }
    const tokM = s.match(new RegExp(CURTOK,"i"));
    let cur = CURS[(inp.cur||"").toUpperCase()] ? inp.cur.toUpperCase() : curFromTok(tokM && tokM[0]);
    let curSrc = "text";
    if (cur==="$") cur = "SGD";
    if (!cur){ cur = HINT_SG.test(inp.merchant) ? "SGD" : HINT_MY.test(inp.merchant) ? "MYR" : localCur(); curSrc = "region"; }
    const c = guessCat(inp.merchant);
    tx = {id:uid(), ts:now, amount:r2(amt), cur, curSrc, kind:"expense", merchant:inp.merchant||(inp.src==="pay"?"Apple Pay":"现金"),
      cat:c.id, need:c.need, fixed:false, note:inp.note, src:inp.src};
    if (inp.src==="pay" && TOPUP_MERCH.test(inp.merchant)) r = {kind:"topup"};
  }
  setHomeAmount(tx);
  if (r && r.kind==="transfer"){ save(); render(); return openInfo({info:`信用卡还款 ${money(tx.amount,tx.cur)} 不算新消费（刷卡时已经记过了）。`, forceTx:tx, seenKey}); }
  if (r && r.kind==="topup"){
    if (S.settings.topupAsSpend){
      tx.kind = "expense"; tx.cat = "wallet"; tx.need = null;
      if (!/TNG|Touch|钱包|wallet/i.test(tx.merchant)) tx.merchant = (tx.merchant ? tx.merchant+" " : "") + "钱包充值";
      tx.note = "充值即算消费";
    } else { save(); render(); return openInfo({info:`这是电子钱包充值（${esc(tx.merchant)} ${money(tx.amount,tx.cur)}），只是把钱换个地方放，不算消费。之后用钱包付款时再记。`, forceTx:tx, seenKey}); }
  } else if (inp.src==="ocr" && S.settings.topupAsSpend && tx.kind==="expense" && /\bTNG\b|Touch ?'?n ?Go|eWallet/i.test(inp.raw)){
    save(); render();
    return openInfo({info:`你开了「TNG 充值算消费」：这笔 TNG 付款（${esc(tx.merchant)} ${money(tx.amount,tx.cur)}）在充值时已经算过了，不再重复扣。`, forceTx:tx, seenKey});
  }
  if (tx.kind==="expense"){
    const dup = S.tx.find(o => o.kind==="expense" && o.src!==tx.src && ["sms","pay","ocr"].includes(o.src) && o.cur===tx.cur && Math.abs(o.amount-tx.amount)<0.005 && Math.abs(o.ts-tx.ts)<5*60e3);
    if (dup){ save(); render(); return openInfo({info:`${money(tx.amount,tx.cur)} 这笔刚刚已经记过（${SRC[dup.src]} 和 ${SRC[tx.src]} 都通知了），没有重复扣。`, forceTx:tx, seenKey}); }
    if (S.settings.fixed.some(f=>Math.abs((+f.amount||0)-((f.cur||HOME())===tx.cur?tx.amount:tx.amountHome))<0.005)) tx.fixed = true;
  }
  if (seenKey) S.seen[seenKey] = now;
  S.tx.push(tx); save(); render();
  openEditor("capture", tx);
}

function insights(k, flex, by, total, reg){
  const out = [];
  const st = S.settings, inc = +st.income||0;
  const sum = arr => arr.reduce((a,t)=>a+amtH(t),0);
  if (!st.setupDone) out.push(["⚙️","先在「设置」填写收入和固定支出，建议才会准确。"]);
  if (inc>0){
    const sr = (+st.savings||0)/inc;
    if (sr < 0.1) out.push(["💰",`你现在每月只存收入的 ${Math.round(sr*100)}%。建议至少存 <b>20%</b>（${money(inc*0.2)}），<b>发工资当天先转走</b>，剩下的才是能花的。`]);
    else out.push(["✅",`每月存 ${money(+st.savings)}（收入的 ${Math.round(sr*100)}%），很好。记得发工资当天就转出去。`]);
    const fr = fixedTotal()/inc;
    if (fr > 0.5) out.push(["🏠",`固定支出占了收入的 ${Math.round(fr*100)}%，超过一半。看看房租、分期、订阅能不能降下来。`]);
  }
  if (!flex.length){ out.push(["🧾","本周期还没有消费记录。开启自动记账后，这里会告诉你哪些钱可以省。"]); return out; }
  const elapsed = Math.max(1, k.dayNo);
  const proj = k.cycleSpent/elapsed*k.totalDays;
  if (k.pool>0){
    if (proj > k.pool*1.05) out.push(["⚠️",`照现在的速度，这个周期会花 <b>${money(proj)}</b>，比预算多 ${money(proj-k.pool)}。从今天起每天控制在 ${money(k.allowance)} 以内就能拉回来。`]);
    else out.push(["📈",`照现在的速度，这个周期大约花 ${money(proj)}，在预算 ${money(k.pool)} 以内。`]);
  }
  if (reg.SG && reg.MY && HOME()==="MYR"){
    const sgDays = new Set(flex.filter(t=>t.cur==="SGD").map(t=>+day0(t.ts))).size || 1;
    const myDays = new Set(flex.filter(t=>t.cur==="MYR").map(t=>+day0(t.ts))).size || 1;
    const a = reg.SG.s/sgDays, b = reg.MY.s/myDays;
    if (a > b*1.5) out.push(["🇸🇬",`在新加坡的日子平均每天花 ${money(a)}，是在马来西亚（${money(b)}/天）的 ${(a/b).toFixed(1)} 倍。能在马来西亚买的东西（日用品、加油、吃饭）尽量在马来西亚解决。`]);
  }
  if (by.waste>0) out.push(["🚫",`你标为「不必要」的花了 <b>${money(by.waste)}</b>。这些钱如果不花，一年能多存约 ${money(by.waste/elapsed*365)}。`]);
  const wantShare = total>0 ? by.want/total : 0;
  if (inc>0 && by.want/elapsed*30 > inc*0.3) out.push(["🎯",`「想要」类每月约 ${money(by.want/elapsed*30)}，超过了收入的 30%。挑一两类最不在乎的先砍。`]);
  else if (wantShare>0.5) out.push(["🎯",`「想要」类占了可支配消费的 ${Math.round(wantShare*100)}%，比较高。`]);
  const drinks = flex.filter(t=>t.cat==="drink");
  if (drinks.length>=3){ const s=sum(drinks); out.push(["🧋",`奶茶/咖啡/零食本周期 ${drinks.length} 次共 ${money(s)}。少一半，每月大约省 ${money(s/elapsed*30/2)}。`]); }
  const takeout = flex.filter(t=>/美团|饿了么|外卖|grab ?food|foodpanda|shopee ?food|deliveroo/i.test(t.merchant+" "+(t.raw||"")));
  if (takeout.length>=4){ const s=sum(takeout); out.push(["🛵",`外卖 ${takeout.length} 次共 ${money(s)}。配送费、服务费通常占 15–25%，每周自己做或自取两三次就能省不少。`]); }
  const rides = flex.filter(t=>/grab(?! ?food)|gojek|tada|ryde|cdg|comfort|taxi|uber/i.test(t.merchant));
  if (rides.length>=5){ const s=sum(rides); out.push(["🚕",`打车 ${rides.length} 次共 ${money(s)}。短途换成地铁/巴士，每月能省一大截。`]); }
  const night = flex.filter(t=>{const h=new Date(t.ts).getHours(); return h>=23||h<4;});
  if (night.length>=2){ const s=sum(night); out.push(["🌙",`深夜（23点后）消费 ${night.length} 次共 ${money(s)}。深夜最容易冲动下单，可以先加购物车、第二天再决定。`]); }
  const subs = flex.filter(t=>t.cat==="sub");
  if (subs.length) out.push(["📺",`订阅/会员 ${subs.length} 笔共 ${money(sum(subs))}。检查有没有不用了还在自动续费的（iPhone：设置 → 你的名字 → 订阅）。`]);
  const small = flex.filter(t=>amtH(t) < (k.planDaily>0? k.planDaily*0.25 : 10));
  if (small.length>=10) out.push(["🪙",`小额消费 ${small.length} 笔加起来 ${money(sum(small))}。小钱最容易被忽略，积少成多。`]);
  const untagged = flex.filter(t=>!t.need && t.cat!=="wallet").length;
  if (untagged) out.push(["🏷️",`有 ${untagged} 笔还没标「必要/想要/不必要」，去账单里点一下，分析会更准。`]);
  return out;
}

function num(v){ const n=parseFloat(String(v).replace(/,/g,"")); return isFinite(n)&&n>=0 ? r2(n) : 0; }
function bindSettings(){
  const st = S.settings;
  const collectFixed = () => {
    document.querySelectorAll("[data-fx]").forEach(el=>{
      const i=+el.dataset.i; if(!st.fixed[i]) return;
      st.fixed[i][el.dataset.fx] = el.dataset.fx==="amount" ? num(el.value) : el.value.trim();
      if (!st.fixed[i].cur) st.fixed[i].cur = st.home;
    });
  };
  const collect = () => {
    st.income = num($("#s-income").value);
    st.savings = num($("#s-savings").value);
    st.payday = +$("#s-payday").value;
    collectFixed();
  };
  $("#s-home").onchange = e => {
    collect();
    const nh = e.target.value;
    if (S.tx.length && !confirm(`改成${CURS[nh].n}后，所有记录会按现在的汇率重新换算。确定吗？`)) { e.target.value = st.home; return; }
    st.home = nh; S.tx.forEach(setHomeAmount); save(); render();
  };
  $("#fx-add").onclick = () => { collect(); st.fixed.push({name:"",amount:0,cur:localCur()}); save(); render(); const r=document.querySelectorAll('[data-fx="name"]'); r.length && r[r.length-1].focus(); };
  document.querySelectorAll("[data-fxdel]").forEach(b=>b.onclick=()=>{ collect(); st.fixed.splice(+b.dataset.fxdel,1); save(); render(); });
  $("#s-save").onclick = () => {
    collect();
    st.fixed = st.fixed.filter(f=>f.name||f.amount);
    if (!st.income){ toast("请填写每月收入"); return; }
    st.setupDone = true; save(); toast("✅ 已保存，每天能花 "+money(calc().planDaily)); tab="home"; render(); scrollTo(0,0);
  };
  $("#s-topup").onchange = e => { collect(); st.topupAsSpend = e.target.checked; save(); toast(st.topupAsSpend?"✅ TNG 充值时就算消费":"已关闭：TNG 付款要截图记账"); };
  $("#s-geo").onchange = e => { collect(); st.geo = e.target.checked; save(); if (st.geo) refreshGeo(true); else { S.geoFix=null; save(); } render(); };
  $("#fx-refresh").onclick = () => { collect(); refreshFx(true); };
  document.querySelectorAll("[data-fxset]").forEach(b=>b.onclick=()=>{
    const c = b.dataset.fxset, h = HOME();
    const v = parseFloat(prompt(`1 ${CURS[c].sym} 等于多少 ${CURS[h].sym}？`, rateTo(c,h).toFixed(4)));
    if (!(v>0)) return;
    S.fx.rates[c] = S.fx.rates[h] / v;
    S.fx.manual = Object.assign(S.fx.manual||{}, {[c]:S.fx.rates[c], [h]:S.fx.rates[h]});
    save(); render(); toast("已手动设置汇率");
  });
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{
    try{ await navigator.clipboard.writeText(b.dataset.copy); toast("已复制"); }catch(e){ toast("复制失败，请长按上面的网址手动复制"); }
  });
  document.querySelectorAll("[data-test]").forEach(b=>b.onclick=()=>{
    const n = Date.now()%1000;
    if (b.dataset.test==="pay") capture({src:"pay", amountStr:"S$"+(8+n%7)+".50", merchant:"Ya Kun Kaya Toast"});
    else if (b.dataset.test==="tng") capture({src:"ocr", raw:`14:3${n%10}\nPayment Successful\n-RM${(5+n%9)}.90\nPaid to\nZUS Coffee - Mid Valley\nWallet Balance\nRM 182.40\nTransaction No. 2026112${n}`});
    else capture({src:"sms", raw:`DBS: You have sent SGD ${(10+n%20)}.00 via PayNow to TAN AH KOW on 21 Nov ${hm(Date.now())}. Ref ${n}. Not you? Call 1800 111 1111`});
  });
  $("#exp-json").onclick = () => download(`每日钱包备份-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(S,null,1), "application/json");
  $("#imp-json").onclick = () => $("#imp-file").click();
  $("#imp-file").onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    f.text().then(t=>{
      const d = JSON.parse(t);
      if (!d || !Array.isArray(d.tx)) throw new Error("bad");
      if (!confirm(`备份里有 ${d.tx.length} 笔记录，恢复会覆盖现在的数据，确定吗？`)) return;
      localStorage.setItem(KEY, JSON.stringify(d)); S = load(); save(); render(); toast("✅ 已恢复");
    }).catch(()=>toast("文件格式不对"));
  };
  $("#exp-csv").onclick = () => {
    const rows = [["日期","时间","类型","金额","币种",`折合${HOME()}`,"分类","必要性","固定支出","商家","备注","来源"]];
    [...S.tx].sort((a,b)=>a.ts-b.ts).forEach(t=>{ const d=new Date(t.ts);
      rows.push([`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, hm(t.ts), {expense:"支出",income:"收入",refund:"退款"}[t.kind], t.amount, t.cur, amtH(t), catOf(t.cat).n, t.need?NEED[t.need].n:"", t.fixed?"是":"", t.merchant||"", t.note||"", SRC[t.src]||""]); });
    const csv = "﻿" + rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
    download(`账单-${new Date().toISOString().slice(0,10)}.csv`, csv, "text/csv");
  };
  $("#wipe").onclick = () => { if (confirm("确定清空所有记录和设置吗？此操作不能撤销。") && confirm("真的确定吗？建议先备份。")){ S=blank(); save(); tab="home"; render(); } };
}
function download(name, content, type){
  const url = URL.createObjectURL(new Blob([content],{type}));
  const a = document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

    <div class="row" style="margin-top:10px;gap:8px">${ex.bad?`<button class="btn sec" style="flex:1" id="go-manual">手动记一笔</button>`:""}<button class="btn" style="flex:1" data-close>好的</button></div></div></div>`;

function openEditor(mode, tx){
  sheetMode = mode;
  if (tx) draft = {...tx};
  else { const c = localCur(); draft = {id:uid(), ts:Date.now(), amount:0, cur:c, curSrc:"region", kind:"expense", cat:"food", need:"need", fixed:false, merchant:"", note:"", src:"manual"}; }
  drawSheet();
}
function drawSheet(){
  const d = draft;
  let top = "";
  if (sheetMode==="capture"){
    const k = calc();
    const isExp = d.kind==="expense";
    top = `<div class="banner ${k.left<0&&isExp?"bad":"ok"}">
      <div class="b1">✅ 已自动记账 · ${esc(d.merchant)} ${isExp?"-":"+"}${money(d.amount, d.cur)}${d.cur!==HOME()?` ≈ ${money(amtH(d))}`:""}</div>
      <div class="b1" style="margin-top:6px">${k.left<0?"今天已超支":"今天还能花"}</div>
      <div class="b2">${dual(Math.abs(k.left),{mainOnly:true})}</div>
      ${!isExp?`<div class="b3">${d.kind==="refund"?"退款已加回今天的额度":"收入不影响每日额度"}</div>`:d.fixed?`<div class="b3">已按固定支出处理，不扣每日额度</div>`:""}
    </div>${isExp?`<p class="sub" style="text-align:center;margin:6px 0 0">这笔钱花得值吗？点一下就好 👇</p>`:""}`;
  }
  const cats = d.kind==="expense" ? CATS : INCOME_CATS;
  const title = {add:"记一笔", edit:"修改", capture:""}[sheetMode];
  const curChips = `<div class="chips curchips" style="margin-top:8px">${["MYR","SGD","CNY","USD"].concat(CURS[d.cur]&&!["MYR","SGD","CNY","USD"].includes(d.cur)?[d.cur]:[]).map(c=>`<button class="chip ${d.cur===c?"on":""}" data-cur="${c}">${CURS[c].sym} ${c}</button>`).join("")}</div>`;
  $("#sheet").innerHTML = `<div class="sheet-bg" data-close><div class="sheet"><div class="grab"></div>
    ${title?`<div class="row"><h1 style="margin:0">${title}</h1><button class="btn sec sm" data-close>取消</button></div>`:""}
    ${top}
    ${sheetMode==="add"?`<details style="margin:10px 0"><summary class="sub" style="cursor:pointer">📋 粘贴短信 / 收据文字自动识别</summary>
      <textarea class="in" id="paste" rows="3" placeholder="把扣款短信或付款成功页面的文字粘贴到这里" style="margin-top:6px"></textarea>
      <button class="btn sec sm" id="paste-go" style="margin-top:6px">识别</button></details>`:""}
    ${d.kind==="expense"?`<div class="need3" style="margin-top:12px">${Object.entries(NEED).map(([id,o])=>`<button class="n-${id} ${d.need===id?"on":""}" data-need="${id}">${o.n}<small>${o.d}</small></button>`).join("")}</div>`:""}
    ${sheetMode!=="capture"?`<div class="seg" style="margin-top:12px">${[["expense","支出"],["income","收入"],["refund","退款"]].map(([k,n])=>`<button class="${d.kind===k?"on":""}" data-kind="${k}">${n}</button>`).join("")}</div>
    <input class="in amount" id="e-amt" inputmode="decimal" placeholder="0.00" value="${d.amount||""}" style="margin-top:12px">${curChips}`:""}
    <label class="f">分类</label>
    <div class="chips">${cats.map(c=>`<button class="chip ${d.cat===c.id?"on":""}" data-cat="${c.id}">${c.e} ${c.n}</button>`).join("")}</div>
    ${d.kind==="expense"?`<label class="toggle"><span>固定支出（房租、分期等）<br><span class="sub">已在预算里预留，不扣每日额度</span></span><input type="checkbox" id="e-fixed" ${d.fixed?"checked":""}></label>`:""}
    ${sheetMode==="capture"?`<details><summary class="sub" style="cursor:pointer;padding:6px 0">修改金额 / 币种 / 商家 / 备注</summary><label class="f">金额</label><input class="in" id="e-amt" inputmode="decimal" value="${d.amount||""}">${curChips}`:""}
    <label class="f">商家 / 用途</label><input class="in" id="e-mer" value="${esc(d.merchant)}" placeholder="例如 午饭、地铁">
    <label class="f">备注</label><input class="in" id="e-note" value="${esc(d.note)}" placeholder="可不填">
    <label class="f">时间</label><input class="in" id="e-time" type="datetime-local" value="${toLocalInput(d.ts)}">
    ${d.raw?`<label class="f">原始内容</label><div class="code">${esc(d.raw)}</div>`:""}
    ${sheetMode==="capture"?`</details>`:""}
    <div class="row" style="margin-top:16px;gap:8px">
      ${sheetMode==="edit"?`<button class="btn danger" id="e-del">删除</button>`:""}
      ${sheetMode==="capture"?`<button class="btn danger" id="e-del">撤销这笔</button>`:""}
      <button class="btn" id="e-ok" style="flex:1">${sheetMode==="capture"?"完成":"保存"}</button>
    </div>
  </div></div>`;
  bindClose();
  const sync = () => {
    const a=$("#e-amt"); if(a) d.amount = num(a.value);
    d.merchant = $("#e-mer").value.trim(); d.note = $("#e-note").value.trim();
    const tv = $("#e-time").value; if (tv && tv!==toLocalInput(d.ts)) { const t = new Date(tv).getTime(); if (isFinite(t)) d.ts = t; }
    const fx=$("#e-fixed"); if(fx) d.fixed = fx.checked;
    setHomeAmount(d);
  };
  const commitLive = () => { if (sheetMode==="capture"){ const i=S.tx.findIndex(t=>t.id===d.id); if(i>=0){ S.tx[i]={...d}; save(); render(); } } };
  document.querySelectorAll("[data-need]").forEach(b=>b.onclick=()=>{ sync(); d.need=b.dataset.need; commitLive(); drawSheet(); });
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{ sync(); d.cat=b.dataset.cat; const c=CATS.find(x=>x.id===d.cat); if(c && d.kind==="expense" && sheetMode!=="edit") d.need=c.need; commitLive(); drawSheet(); });
  document.querySelectorAll("[data-cur]").forEach(b=>b.onclick=()=>{ sync(); d.cur=b.dataset.cur; d.curSrc="manual"; setHomeAmount(d); commitLive(); drawSheet(); });
  document.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{ sync(); d.kind=b.dataset.kind; d.cat = d.kind==="expense"?"food":d.kind==="refund"?"refund":"salary"; d.need = d.kind==="expense"?"need":null; if(d.kind!=="expense") d.fixed=false; drawSheet(); });
  const fx=$("#e-fixed"); if (fx) fx.onchange=()=>{ sync(); commitLive(); drawSheet(); };
  const pg=$("#paste-go"); if (pg) pg.onclick=()=>{
    const raw = $("#paste").value;
    const r = parseTx(raw, "paste");
    if (!r.ok) { toast("识别失败："+r.reason); return; }
    if (r.kind==="transfer"||r.kind==="topup") toast("看起来是还款/充值，确认是消费再保存");
    d.amount=r.amount; d.cur=r.cur; d.curSrc=r.curSrc; d.kind=(r.kind==="income"||r.kind==="refund")?r.kind:"expense"; d.merchant=r.merchant; d.src="paste"; d.raw=raw.slice(0,400);
    if (d.kind==="expense"){ const c=guessCat(r.merchant+" "+raw); d.cat=c.id; d.need=c.need; } else d.cat = d.kind==="refund"?"refund":"inc_other";
    S.seen["s"+hash(raw)] = Date.now();
    setHomeAmount(d); drawSheet(); toast("已识别，确认后点保存");
  };
  $("#e-ok").onclick = () => {
    sync();
    if (!(d.amount>0)) { toast("请输入金额"); return; }
    const mode = sheetMode;
    const i = S.tx.findIndex(t=>t.id===d.id);
    if (i>=0) S.tx[i]={...d}; else S.tx.push({...d});
    save(); closeSheet(); render();
    if (mode!=="capture" && d.kind==="expense") toast("已记录，今天还能花 "+dual(calc().left,{mainOnly:true}));
  };
  const del=$("#e-del"); if (del) del.onclick=()=>{
    if (sheetMode==="edit" && !confirm("删除这笔记录？")) return;
    S.tx = S.tx.filter(t=>t.id!==d.id); save(); closeSheet(); render(); toast("已删除");
  };
}
function openWhere(){
  const st = S.settings, r = regionNow();
  const opt = (id, label, sub) => `<button class="opt ${st.regionMode===id?"on":""}" data-rm="${id}"><span class="f">${id==="auto"?"🧭":REGIONS[id].f}</span><span><b>${label}</b><br><span class="sub">${sub}</span></span></button>`;
  sheetMode="where"; draft={};
  $("#sheet").innerHTML = `<div class="sheet-bg" data-close><div class="sheet"><div class="grab"></div>
    <div class="row"><h1 style="margin:0">现在在哪里？</h1><button class="btn sec sm" data-close>关闭</button></div>
    <p class="hint">决定首页用什么货币显示、现金记账默认什么币种。交易本身带币种的（S$ / RM）会自动识别，不受这里影响。</p>
    ${opt("auto","自动判断（推荐）",`现在判断：${REGIONS[r.cc].f} ${REGIONS[r.cc].n}（${st.regionMode==="auto"?r.how:"…"}）`)}
    ${opt("SG","新加坡","固定用新币 S$")}
    ${opt("MY","马来西亚","固定用马币 RM")}
    ${opt("CN","中国","固定用人民币 ¥")}
    ${!st.geo?`<button class="btn sec block" id="geo-on" style="margin-top:6px">📍 开启定位，自动分清新山 / 新加坡</button>`:`<button class="btn sec block" id="geo-now" style="margin-top:6px">📍 重新定位</button>`}
  </div></div>`;
  bindClose();
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ st.regionMode=b.dataset.rm; save(); closeSheet(); render(); });
  $("#geo-on") && ($("#geo-on").onclick=()=>{ st.geo=true; st.regionMode="auto"; save(); refreshGeo(true); closeSheet(); render(); });
  $("#geo-now") && ($("#geo-now").onclick=()=>{ refreshGeo(true); closeSheet(); });
}
function toLocalInput(ts){ const d=new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }

/* ========== 事件 ========== */
document.addEventListener("click", e=>{
  const w = e.target.closest("[data-where]");
  if (w && !w.closest("#sheet")) { openWhere(); return; }
  const t = e.target.closest("[data-tab],[data-go],[data-edit],[data-filter]");
  if (!t || t.closest("#sheet")) return;
  if (t.dataset.tab){ tab=t.dataset.tab; render(); scrollTo(0,0); }
  else if (t.dataset.go){ tab=t.dataset.go; render(); const a=t.dataset.anchor && document.getElementById(t.dataset.anchor); if(a){a.open=true;a.scrollIntoView();} else scrollTo(0,0); }
  else if (t.dataset.edit){ const tx=S.tx.find(x=>x.id===t.dataset.edit); if(tx) openEditor("edit", tx); }
  else if (t.dataset.filter){ listFilter=t.dataset.filter; render(); }
});
$("#fab").onclick = () => openEditor("add", null);
window.addEventListener("hashchange", readHash);
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden && !draft) { S = load(); render(); refreshGeo(); refreshFx(); } });

render();
readHash();
refreshGeo();
refreshFx();
</script>
</body>
</html>
